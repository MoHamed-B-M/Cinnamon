name: Beta Preview Release

on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract versionName & short SHA
        id: meta
        run: |
          VER=$(grep -oP 'versionName\s*=\s*"\K[0-9.]+' app/build.gradle.kts | head -n1)
          if [ -z "$VER" ]; then
            echo "Could not determine versionName from app/build.gradle.kts"
            exit 1
          fi
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "BETA_TAG=beta" >> "$GITHUB_ENV"
          echo "BETA_NAME=Cinnamon_${VER}-beta+${SHORT_SHA}.apk" >> "$GITHUB_ENV"
          echo "Detected version: $VER (sha: $SHORT_SHA)"

      - name: Decode keystore
        env:
          KEYSTORE_FILE_B64: ${{ secrets.KEYSTORE_FILE_B64 }}
        run: |
          if [ -z "$KEYSTORE_FILE_B64" ]; then
            echo "::error::Missing secret KEYSTORE_FILE_B64. See .github/KEYSTORE_SETUP.md"
            exit 1
          fi
          # Strip PEM headers if user used certutil -encode, remove whitespace/newlines, then decode
          printf '%s' "$KEYSTORE_FILE_B64" | sed '/-----BEGIN/d;/-----END/d' | tr -d '\n\r ' | base64 -d > "$PWD/cinnamon-release.jks"
          echo "Keystore decoded to $PWD/cinnamon-release.jks"
          ls -lh "$PWD/cinnamon-release.jks"
          # Fail fast if b64 was truncated/corrupted
          if [ ! -s "$PWD/cinnamon-release.jks" ]; then
            echo "::error::Decoded keystore is empty — secret truncated or bad base64. Re-create KEYSTORE_FILE_B64 (must be single line, no headers)."
            exit 1
          fi

      - name: Validate keystore (diagnostics)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Validating keystore alias=$KEY_ALIAS ..."
          if ! keytool -list -keystore "$PWD/cinnamon-release.jks" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" >/tmp/kt.log 2>&1; then
            echo "::error::Keystore validation failed — wrong KEYSTORE_PASSWORD / KEY_ALIAS or corrupt KEYSTORE_FILE_B64"
            echo "--- keytool output ---"
            cat /tmp/kt.log
            echo "--- diagnostics ---"
            echo "File size: $(stat -c%s "$PWD/cinnamon-release.jks" 2>/dev/null || stat -f%z "$PWD/cinnamon-release.jks") bytes"
            echo "Alias: $KEY_ALIAS"
            echo "Hint: Regenerate b64 with: [Convert]::ToBase64String([IO.File]::ReadAllBytes('cinnamon-release.jks')) | Set-Content -NoNewline keystore.b64  (PowerShell) or base64 -w 0 (Linux) — NOT certutil -encode"
            exit 1
          fi
          echo "Keystore OK — storepass + alias valid"
          keytool -list -v -keystore "$PWD/cinnamon-release.jks" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | head -n 25
          echo ""
          echo "Validating KEY_PASSWORD for alias=$KEY_ALIAS ..."
          # This catches 'Given final block not properly padded' when KEY_PASSWORD is wrong (storepass correct but keypass wrong)
          if ! keytool -importkeystore -srckeystore "$PWD/cinnamon-release.jks" -destkeystore /tmp/test.p12 -srcstoretype JKS -deststoretype PKCS12 -srcstorepass "$KEYSTORE_PASSWORD" -deststorepass "$KEYSTORE_PASSWORD" -srcalias "$KEY_ALIAS" -srckeypass "$KEY_PASSWORD" -noprompt >/tmp/kp.log 2>&1; then
            echo "::error::KEY_PASSWORD validation failed — wrong KEY_PASSWORD for alias $KEY_ALIAS (or KEY_ALIAS typo)"
            cat /tmp/kp.log
            echo "---"
            echo "If you created keystore with -storepass == -keypass, set KEY_PASSWORD same as KEYSTORE_PASSWORD"
            echo "List aliases to verify: keytool -list -keystore cinnamon-release.jks -storepass <pass>"
            exit 1
          fi
          echo "KEY_PASSWORD OK"
          rm -f /tmp/test.p12 /tmp/kt.log /tmp/kp.log

      - name: Export signing env
        run: |
          {
            echo "KEYSTORE_FILE=$PWD/cinnamon-release.jks"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build Release APK
        run: ./gradlew assembleRelease --parallel --no-daemon

      - name: Prepare beta APK artifact
        run: |
          SRC="app/build/outputs/apk/release/Cinnamon_${{ env.VERSION }}.apk"
          DST="app/build/outputs/apk/release/${{ env.BETA_NAME }}"
          if [ ! -f "$SRC" ]; then
            echo "::error::Expected APK not found at $SRC"
            ls -R app/build/outputs
            exit 1
          fi
          cp "$SRC" "$DST"
          echo "Beta APK: $DST"
          ls -lh app/build/outputs/apk/release/

      - name: Delete previous beta release (auto-cleanup)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete previous 'beta' tag + release if exists — so only ONE preview release survives
          # This satisfies "delete auto after i push again and generate other release"
          if gh release view beta >/dev/null 2>&1; then
            echo "Deleting previous beta release..."
            gh release delete beta --yes --cleanup-tag || echo "Failed to delete release, continuing"
          else
            echo "No previous beta release found"
          fi
          # Also delete the tag locally/remotely if it lingers without release
          git push origin :refs/tags/beta 2>/dev/null || echo "No remote beta tag to delete"

      - name: Create / Update Beta Prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: "Preview • v${{ env.VERSION }}-beta+${{ env.SHORT_SHA }}"
          body: |
            ### 🧪 Beta Preview — auto-replaced on next push to `beta`

            > This is an **ephemeral preview**. Pushing again to `beta` deletes this release and creates a new one with the same `beta` tag.

            - **Version:** `${{ env.VERSION }}`
            - **Commit:** `${{ github.sha }}`
            - **Branch:** `beta`
            - **Build:** `${{ github.run_number }}`
            - **APK:** `${{ env.BETA_NAME }}`

            This prerelease is **not** marked as `latest` and will be overwritten.

            ---
            *Generated by `release_beta.yml` on ${{ github.event.head_commit.timestamp }}*
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/release/${{ env.BETA_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload beta APK as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: Cinnamon-beta-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/release/${{ env.BETA_NAME }}
          retention-days: 7
